name: Compile Programmatic Book

on:
  workflow_dispatch:
    inputs:
      state_file:
        description: 'Path to state JSON'
        required: true
        default: 'volume_state.json'
      model_name:
        description: 'Select Google AI Studio Model'
        required: true
        default: 'gemini-3.8-flash'
        type: choice
        options:
          - gemini-3.8-flash
          - gemini-3.6-flash
          - gemini-3.5-flash-lite
          - gemini-3.1-flash-lite
          - gemini-3-flash
          - gemini-2.5-flash

permissions:
  contents: write

jobs:
  build-book:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install OS Libraries for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libcairo2 libgdk-pixbuf-2.0-0 libffi-dev shared-mime-info fonts-liberation

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Execute Pipeline
        env:
          LEXAWRITES: ${{ secrets.LEXAWRITES }}
          STATE_FILE: ${{ github.event.inputs.state_file }}
          MODEL_NAME: ${{ github.event.inputs.model_name }}
        run: python -u pipeline.py

      - name: Commit Verified Chapter Cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build/chapters/ || true
          git diff --staged --quiet || git commit -m "Cache verified chapters for ${{ github.event.inputs.state_file }}"
          git push

      - name: Upload Print-Ready PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: print-ready-pdf
          path: output_v*.pdf
          retention-days: 30
